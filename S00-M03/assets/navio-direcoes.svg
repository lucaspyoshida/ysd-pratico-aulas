<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
<title id="t">Direções relativas a bordo</title><desc id="d">Vista superior de um navio com proa à esquerda, popa à direita, avante, a ré, traveses e amuras indicados; bochecha e amura aparecem associadas junto à proa.</desc>
